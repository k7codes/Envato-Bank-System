spring:
  application:
    name: bank-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/envato_bank}
    username: ${DB_USERNAME:bank_app}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: envato-bank-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      issuer: envato-bank
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 2592000
      secret: ${JWT_SECRET}
    encryption:
      key: ${PII_ENCRYPTION_KEY}
      index-key: ${PII_INDEX_KEY}
    argon2:
      salt-length: 16
      hash-length: 32
      parallelism: 1
      memory-in-kib: 65536
      iterations: 3
    login:
      max-failed-attempts: 5
      lock-minutes: 15
  transfer:
    per-transaction-limit-minor: 250000000
    daily-limit-minor: 1000000000
  seed:
    enabled: ${APP_SEED_ENABLED:true}
